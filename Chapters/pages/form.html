<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Heading */
        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Form Container */
        body>div {
            width: 400px;
            margin-bottom: 15px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        /* Input Fields */
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        /* Textarea */
        textarea {
            height: 100px;
            resize: vertical;
        }

        /* Focus Effect */
        input:focus,
        textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Button Hover */
        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Booking Form</h1>

    <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
    </div>

    <div>
        <label for="phone">Phone</label>
        <input type="number" id="phone" placeholder="Enter your phone" required>
    </div>

    <div>
        <label for="address">Address</label>
        <textarea type="text" id="address" placeholder="Enter your address"></textarea>
    </div>

    <div>
        <button type="submit">Submit</button>
    </div>

</body>

</html>
